name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least-privilege default token; jobs opt into more only where needed.
permissions:
  contents: read

jobs:
  build:
    name: Audit & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install ONLY from the committed lockfile (integrity-pinned).
      # Never `npm install` in CI — it can silently resolve new versions.
      - name: Install (locked)
        run: npm ci --ignore-scripts

      # Fail the build on known-vulnerable runtime dependencies.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax check
        run: node --check extension.js

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out quicksync-sftp.vsix

      - name: Compute checksum
        run: sha256sum quicksync-sftp.vsix | tee quicksync-sftp.vsix.sha256

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: |
            quicksync-sftp.vsix
            quicksync-sftp.vsix.sha256
          if-no-files-found: error

  publish:
    name: Publish to Marketplace
    # Only on a version tag, and only after the build/audit passes.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: marketplace # gate behind a protected environment for approvals
    permissions:
      contents: write # create the GitHub Release + upload assets
      id-token: write # mint the OIDC token used to sign provenance
      attestations: write # record the build provenance attestation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked)
        run: npm ci --ignore-scripts

      - name: Re-audit before publish
        run: npm audit --omit=dev --audit-level=high

      # Build the EXACT artifact we will publish + attest + release, named by tag.
      - name: Package VSIX
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="quicksync-sftp-${VERSION}.vsix"
          npx --yes @vscode/vsce package --out "$OUT"
          echo "VSIX=$OUT" >> "$GITHUB_ENV"

      - name: Compute checksum
        run: sha256sum "$VSIX" | tee "$VSIX.sha256"

      # Cryptographic build provenance (SLSA): proves this .vsix was built by
      # THIS workflow from THIS commit. Verifiable later with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.VSIX }}

      # VSCE_PAT must be stored as an encrypted environment secret.
      # Publish the exact file we built/attested — never echo the PAT.
      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is not set — refusing to publish." >&2
            exit 1
          fi
          npx --yes @vscode/vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT"

      # Attach the signed artifact + checksum to a GitHub Release for auditability.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(cut -d' ' -f1 < "$VSIX.sha256")"
          NOTES="SHA-256: ${SHA}. Verify provenance: gh attestation verify ${VSIX} --repo ${{ github.repository }}"
          gh release create "$GITHUB_REF_NAME" \
            "$VSIX" "$VSIX.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$NOTES"
